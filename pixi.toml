[workspace]
name = "peakloc"
version = "0.1.0"
description = "Event-camera SMLM localization pipeline"
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]

[dependencies]
python = "3.12.*"
awkward = "*"
cryptography = "*"
csaps = "*"
h5py = "*"
interpolation = "*"
joblib = "*"
matplotlib = "*"
matplotlib-scalebar = "*"
natsort = "*"
numba = "*"
numpy = "*"
scikit-image = "*"
scipy = "*"
tifffile = "*"
loguru = ">=0.7.3,<0.8"
plotly = ">=6.8.0,<7"
imageio-ffmpeg = ">=0.6.0,<0.7"
kiwisolver = ">=1.5.0,<2"

[activation.env]
PYTHONNOUSERSITE = "1"

[target.win-64.dependencies]
# The installed Prophesee bindings are compiled for CPython 3.9.
python = "3.9.*"
# Plotly 6 requires Python 3.10; the dashboard uses APIs available in Plotly 5.
plotly = ">=5,<6"
# Kiwisolver 1.5 builds start at Python 3.10.
kiwisolver = ">=1.4,<1.5"

[target.linux-64.dependencies]
ipywidgets = ">=8.1.8,<9"
jupyterlab = ">=4.6.1,<5"
pixi-kernel = ">=0.7.1,<0.8"
python-kaleido = ">=1.3.0,<2"
ty = "*"

[target.win-64.activation]
scripts = ["scripts/activate_metavision.bat"]

[target.win-64.activation.env]
PATH = "%CONDA_PREFIX%\\Library\\bin;%CONDA_PREFIX%;%CONDA_PREFIX%\\Scripts;%PATH%"

[feature.dev.dependencies]
pytest = "*"
ruff = "*"
pyinstaller = ">=6.15.0,<7"

[feature.dev.tasks]
test = "pytest"
lint = "ruff check --fix ."
format = "ruff format ."
typecheck = "ty check"

[environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
all = { features = ["dev"], solve-group = "default" }

[tasks]
clean-temp = "python -m scripts.clean_temp_files"
check-openeb = "python -m scripts.check_openeb"
import-test = "python -m scripts.import_test"
peakloc = "python PeakLoc.py"
build-event-calibration = "python -m calibration_scripts.build_event_calibration"
spatial-mask-tuner = "python -m scripts.spatial_mask_tuner"
peaks-dict-to-locs = "python -m scripts.peaks_dict_to_locs"
plot-result = "python -m scripts.plot_localizations"
raw-to-video = "python -m scripts.raw_to_video"
raw-to-tiff-stack = "python -m scripts.raw_to_tiff_stack"
raw-to-npz = "python -m scripts.raw_to_npz"
gui = "python PeakLocGUI.py"
build-gui = "powershell -ExecutionPolicy Bypass -File scripts/build_gui.ps1"
